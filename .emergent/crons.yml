crons:
  - name: reset-demo-data
    description: "Refresh the read-only demo account data daily so visitors always see clean sample projects"
    cron: "0 20 * * *"
    endpoint: "{{BASE_URL}}/api/cron/reset-demo"
    method: POST
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    enabled: true
  - name: renewal-reminders
    description: "Create in-app renewal reminders for Premium users whose subscription expires within 7 days"
    cron: "0 1 * * *"
    endpoint: "{{BASE_URL}}/api/cron/renewal-reminders"
    method: POST
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    enabled: true
  - name: weekly-backup
    description: "Create a stored ZIP backup (data + photos) for every user every week so data is safe automatically"
    cron: "0 18 * * 0"
    endpoint: "{{BASE_URL}}/api/cron/weekly-backup"
    method: POST
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    enabled: true
